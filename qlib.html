<title>模拟盘</title>
<style>
:root { color-scheme: light; --bg: #f4f3f0; --surface: #fcfcfb; --border: #e3e1dc; --text: #0b0b0b; --text-2: #52514e; --accent: #2a78d6; --bad: #c43535; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --bg: #121211; --surface: #1a1a19; --border: #2e2e2c; --text: #f0efec; --text-2: #c3c2b7; --accent: #3987e5; --bad: #e66767; } }
:root[data-theme="dark"] { color-scheme: dark; --bg: #121211; --surface: #1a1a19; --border: #2e2e2c; --text: #f0efec; --text-2: #c3c2b7; --accent: #3987e5; --bad: #e66767; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; padding: 16px; }
form { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
h1 { font-size: 20px; margin: 0 0 16px; }
input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px;
  background: var(--bg); color: var(--text); }
label { display: block; margin: 12px 0; color: var(--text-2); font-size: 14px; }
button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; }
button:disabled { opacity: .6; }
#err { color: var(--bad); font-size: 14px; min-height: 1.5em; margin: 10px 0 0; }
.revision { color: var(--text-2); font-size: 12px; margin: 12px 0 0; }
</style>
</head>

<script>
const P = JSON.parse(document.getElementById("payload").textContent), KEY = "pd-key-v1";
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const str = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const store = { get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }, clear() { try { localStorage.removeItem(KEY); } catch (e) {} } };
async function decrypt(key) {
  return new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: bytes(P.iv)}, key, bytes(P.ct)));
}
async function render(html) {  // document.open() is ignored while this page is still loading
  if (document.readyState !== "complete") await new Promise(r => addEventListener("load", r, {once: true}));
  document.open(); document.write(html); document.close();
}
async function fromPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: bytes(P.salt), iterations: P.iter, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
(async () => {
  const saved = store.get(), form = document.getElementById("f");
  if (!saved) return;
  form.style.visibility = "hidden";
  try { await render(await decrypt(await crypto.subtle.importKey("raw", bytes(saved), "AES-GCM", true, ["decrypt"]))); }
  catch (e) { store.clear(); form.style.visibility = ""; }
})();
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; err.textContent = "";
  try {
    const key = await fromPassword(document.getElementById("pw").value);
    const html = await decrypt(key);
    if (document.getElementById("remember").checked) store.set(str(await crypto.subtle.exportKey("raw", key)));
    await render(html);
  } catch (e) { err.textContent = "密码不对"; go.disabled = false; }
});
</script>
